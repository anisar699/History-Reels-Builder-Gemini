[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "history-reels-builder"
version = "0.1.0"
description = "Local-first AI short-video generation dashboard and CLI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "streamlit==1.59.2",
    "requests==2.34.2",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.2",
    "edge-tts==7.2.8",
    "pydantic==2.13.4",
    "fonttools==4.61.1",
    "pillow==12.3.0",
]

[project.scripts]
history-reels = "history_reels.cli:main"

[tool.setuptools.packages.find]
include = ["history_reels*"]
